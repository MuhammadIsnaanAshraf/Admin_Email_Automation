<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/flowstate.svg" />
    <link rel="apple-touch-icon" href="/flowstate.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Zenviqo — Admin Console</title>
    <style>
      html { background: #0b0e14; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 80% at 50% -10%, #141a24 0%, #0b0e14 60%);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      #boot .boot__logo {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: #46f019;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 44px rgba(70, 240, 25, 0.35);
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      #boot .boot__ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.14);
        border-top-color: #46f019;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .boot__word {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f4f6fa;
      }
      #boot .boot__tag {
        font-family: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5b6472;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 44px rgba(70, 240, 25, 0.35); }
        50% { transform: scale(1.06); box-shadow: 0 0 64px rgba(70, 240, 25, 0.5); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot__logo, #boot .boot__ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite" aria-label="Loading Zenviqo Admin">
        <div class="boot__logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0a0f0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9a4 4 0 0 1 8 0c0 3-4 3-4 6a4 4 0 0 0 8 0" />
            <circle cx="19" cy="8" r="1.4" fill="#0a0f0a" stroke="none" />
          </svg>
        </div>
        <div class="boot__ring"></div>
        <div class="boot__word">Zenviqo</div>
        <div class="boot__tag">Admin console loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
